services:
  nginx:
    build: ./nginx
    container_name: monitored-nginx
    ports:
      - "8080:80"

  redis:
    image: redis:alpine
    container_name: monitoring-redis

  rabbitmq:
    image: rabbitmq:4-management
    container_name: monitoring-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  watcher:
    build: ./watcher
    depends_on:
      nginx:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  mailer:
    build: ./mailer
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./mailer/.env
