services:
  nginx:
    build: ./nginx
    container_name: monitored-nginx
    ports:
      - "8080:80"

  redis:
    image: redis:alpine
    container_name: monitoring-redis

  rabbitmq:
    image: rabbitmq:4-management
    container_name: monitoring-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  watcher:
    build: ./watcher
    restart: unless-stopped
    read_only: true
    cpus: "0.25"
    mem_limit: 256m
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    depends_on:
      nginx:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  mailer:
    build: ./mailer
    restart: unless-stopped
    read_only: true
    cpus: "0.5"
    mem_limit: 512m
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    secrets:
      - smtp_password
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./mailer/.env
    ports:
      - "3000:3000"

  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - mailer

  grafana:
    image: grafana/grafana:latest
    container_name: monitoring-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  grafana-data:

secrets:
  smtp_password:
    file: ./secrets/smtp_password.txt
